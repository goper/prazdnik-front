<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Месяц ночного неба тёмной темы (assets/css/main.css), как на заставке clay-forest.webp: медовый серп с мягким светом. -->
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f7c674" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f7c674" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="96" height="96" fill="#fff"/>
      <circle cx="58" cy="40" r="22" fill="#000"/>
    </mask>
  </defs>
  <circle cx="48" cy="48" r="47" fill="url(#glow)"/>
  <g mask="url(#crescent)">
    <circle cx="46" cy="49" r="25" fill="#f7c674"/>
    <circle cx="40" cy="55" r="25" fill="#000" opacity=".12"/>
  </g>
</svg>
